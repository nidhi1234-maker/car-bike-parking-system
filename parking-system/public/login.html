<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Parking Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="p-sign" aria-hidden="true">P</div>
    <h1>Parking Register</h1>
    <p class="muted">Log in to see who is parked and which slots are free.</p>

    <div class="seg" role="tablist" aria-label="Login type">
      <button type="button" role="tab" class="active" data-role="admin" aria-selected="true">Admin</button>
      <button type="button" role="tab" data-role="user" aria-selected="false">User</button>
    </div>

    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary wide" type="submit">Log in</button>
      <p id="msg" class="msg" role="alert"></p>
    </form>
    <p class="muted small" id="roleHint">Admins can add vehicles and unpark them.</p>
  </main>

  <script>
    let role = 'admin';
    const hints = {
      admin: 'Admins can add vehicles and unpark them.',
      user: 'Users can view records, search history and book slots.'
    };
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      role = b.dataset.role;
      document.querySelectorAll('.seg button').forEach(x => {
        x.classList.toggle('active', x === b);
        x.setAttribute('aria-selected', x === b);
      });
      document.getElementById('roleHint').textContent = hints[role];
    }));

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = ''; msg.className = 'msg';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = '/';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg err';
      }
    });
  </script>
</body>
</html>
